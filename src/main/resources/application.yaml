spring:
  application:
    name: ProductService

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dizprakash@gmail.com}
    password: ${MAIL_PASSWORD:mrwctpvpgkwwftyf}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
        retry:
          enabled: true
          initial-interval: 2s
          max-interval: 10s
          multiplier: 2
          max-retries: 3

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  rabbitmq:
    product-exchange: ${PRODUCT_EXCHANGE:product.exchange}
    product-created-queue: ${PRODUCT_CREATED_QUEUE:product.created.queue}
    product-created-routing-key: ${PRODUCT_CREATED_ROUTING_KEY:product.created}
    dead-letter-exchange: ${RABBITMQ_DLX:product.dlx}
    product-created-dead-letter-queue: ${PRODUCT_CREATED_DLQ:product.created.dlq}
    product-created-dead-letter-routing-key: ${PRODUCT_CREATED_DLK:product.created.dead}
    notification-email: ${PRODUCT_NOTIFICATION_EMAIL:}
    listener-auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
    publish-fail-fast: ${RABBITMQ_PUBLISH_FAIL_FAST:false}
    listener-retry-max-attempts: ${RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
    listener-retry-initial-interval: ${RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:2000}
    listener-retry-multiplier: ${RABBITMQ_LISTENER_RETRY_MULTIPLIER:2.0}
    listener-retry-max-interval: ${RABBITMQ_LISTENER_RETRY_MAX_INTERVAL:10000}
