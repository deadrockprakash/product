name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Trigger only when pushing to main branch
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 21 with CACHING enabled
      # The 'cache: maven' part is the most important for your "lots of dependencies"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # <--- This caches your .m2 folder automatically!

      # 3. Build and Test the application
      # We use ./mvnw (Maven Wrapper) so we don't have to install maven on the server
      - name: run tests and build
        run: |
           chmod +x mvnw 
          ./mvnw clean test  # Run tests first
      - name: Build with Maven
        run: |
           chmod +x mvnw 
          ./mvnw clean package -DskipTests # Remove -DskipTests if you want to run tests

      # 4. Log in to Docker Hub (or your private registry)
      # We use secrets to keep passwords safe
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the Docker Image and Push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image as 'latest' and also with the unique Git Commit ID
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}

      # 6. Deploy to the Production Server via SSH
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the app folder
            cd /home/${{ secrets.SERVER_USER }}/app
            # Pull the latest image from Docker Hub
            docker compose pull
            # Restart the containers in detached mode
            docker compose up -d
            # Clean up old unused images to save disk space
            docker image prune -f