version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?prakash1234}
        MYSQL_DATABASE: product
        MYSQL_USER: ${DB_USERNAME:root}
        MYSQL_PASSWORD: ${DB_PASSWORD:?prakash1234}
    ports:
         - "3307:3306"
    volumes:
        - mysql-data:/var/lib/mysql
    networks:
        - product-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    #build: . this is for development, when you want to build the image locally from the Dockerfile
    image: dizprakash/product-service
    container_name: product-service
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/product
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SERVER_PORT: ${SERVER_PORT:-8089}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-8089}:${SERVER_PORT:-8089}"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
        - product-network


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # Mount the config file
      - prometheus-data:/prometheus # Persistent storage for metrics
    ports:
      - "9090:9090"
    networks:
      - product-network


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var,lib/grafana # Persistent storage for dashboards
    networks:
      - product-network
    depends_on:
      - prometheus


networks:
    product-network:
        driver: bridge

volumes:
    mysql-data:
    prometheus-data:
    grafana-data:
